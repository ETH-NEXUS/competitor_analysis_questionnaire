[project]
name = "fsex-api"
version = "0.1.0"
description = "NEXUS Fullstack Template"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.10",
    "django-redis>=6.0.0",
    "django-environ>=0.12.0",
    "django-extensions>=4.1",
    "django-cors-headers>=4.9.0",
    "django-guardian>=3.2.0",
    "django-filter>=25.2",
    "django-dbbackup>=5.1.2",
    "django-structlog>=10.0.0",
    "djangorestframework>=3.16.1",
    "dj-rest-auth>=7.0.2",
    "gunicorn>=23.0.0",
    "structlog>=25.5.0",
    "sqlparse>=0.5.5",
    "uvicorn>=0.40.0",
    "psycopg[binary]>=3.2.0",
    "rich>=14.2.0",
    "celery[redis]>=5.6.0",
    "django-celery-beat>=2.8.0",
    "django-celery-results>=2.5.0",
    "langchain==1.2.3",
    "langchain-ollama==1.0.1",
]

[project.optional-dependencies]
dev = [
    "django-stubs>=5.2.0",
    "djangorestframework-stubs>=3.16.0",
    "mypy>=1.19.0",
    "ruff>=0.14.11",
    "pytest-django>=4.11.1",
    "pytest-cov>=7.0.0",
    "drf-spectacular>=0.29.0",
    "drf-spectacular-sidecar>=2026.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = [
    # Core correctness
    "F",    # Pyflakes
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings

    # Readability / style / modernization
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern syntax)
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "INT",  # flake8-gettext
    "DJ",   # flake8-django
    "N",    # pep8-naming rules

    # Common bug patterns
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "DTZ",  # flake8-datetimez
    "ARG",  # flake8-unused-arguments
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "BLE",  # flake8-blind-except
    "FBT",  # flake8-boolean-trap
    "TRY",  # tryceratops
    "RET",  # flake8-return
    "ERA",  # eradicate
    "G",    # flake8-logging-format
    "LOG",  # flake8-logging

    # Complexity / clean code
    "C90",  # mccabe complexity
    "PL",   # Pylint rules (Ruff subset)
    "PERF", # performance anti-patterns
    "FURB", # refurb cleanups
]
ignore = [
    # Formatting is handled by Ruff formatter
    "E501",
    # tryceratops rules that are often noisy
    "TRY003",
    "TRY301",
    # mutable class attributes requiring `typing.ClassVar`
    "RUF012",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 40
max-nested-blocks = 4

[tool.ruff.lint.isort]
known-first-party = ["core", "fsex"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.flake8-unused-arguments]
# Don't flag *args / **kwargs (required by framework signatures, e.g. Command.handle)
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E", "F401", "F841", "I", "UP", "RUF", "B", "PL", "ARG"]
"**/tests/**/*.py" = ["S106", "S107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fsex.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "fsex.settings"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
